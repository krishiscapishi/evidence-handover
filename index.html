<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>Relay — Evidence based handovers</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Relay home">
      <span class="brand-mark">R</span>
      <span>relay<span class="brand-dot">.</span><small>PROJECT HANDOVERS</small></span>
    </a>
    <div class="topbar-right">
      <span class="round-tag"><span class="live-dot"></span> ROUND 2 DEMO</span>
      <button class="button button-quiet" id="resetBtn" hidden>Start over</button>
    </div>
  </header>
  <main id="app" class="page-shell">
    <div class="loading">Loading your workspace…</div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sourceDialog" class="dialog-backdrop" hidden>
    <section class="source-dialog" role="dialog" aria-modal="true" aria-labelledby="sourceTitle">
      <div class="dialog-head">
        <div><span class="eyebrow">SOURCE EVIDENCE</span><h2 id="sourceTitle">Document</h2></div>
        <button class="icon-button" id="closeDialog" aria-label="Close source">×</button>
      </div>
      <pre id="sourceContent"></pre>
      <div class="dialog-foot"><span class="source-note">Source lines are shown exactly as uploaded.</span></div>
    </section>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
